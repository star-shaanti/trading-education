<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Trading Education Logo</title>
  <desc id="logo-desc">Four candlestick chart representing trading education.</desc>
  
  <defs>
    <style>
      .candle-shadow {
        filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.2));
      }
      @media (prefers-color-scheme: dark) {
        .candle-shadow {
          filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }
      }
    </style>
  </defs>
  
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" class="candle-shadow">
    <path d="M16 22V12M16 84V68M36 22V8M36 84V60M60 22V12M60 84V68M80 22V6M80 84V64"/>
  </g>
  
  <!-- Bearish candles (red) -->
  <rect x="8"  y="22" width="16" height="44" rx="3" fill="#DC2626" class="candle-shadow"/>
  <rect x="52" y="22" width="16" height="44" rx="3" fill="#DC2626" class="candle-shadow"/>
  
  <!-- Bullish candles (green) -->
  <rect x="28" y="22" width="16" height="38" rx="3" fill="#16A34A" class="candle-shadow"/>
  <rect x="72" y="22" width="16" height="52" rx="3" fill="#16A34A" class="candle-shadow"/>
</svg>

